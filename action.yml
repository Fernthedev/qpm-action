name: 'QPM Action'
description: 'Sets up QPM2, restores and caches dependencies, and publishes packages to qpackages.com'
author: 'Fernthedev'

inputs:
  # Setup
  qpm_version:
    required: false
    description:
      'QPM to download. A semver range (^2.0.0) uses the newest matching release, falling back to the bleeding
      pre-release until one exists. "bleeding" uses the bleeding pre-release. Anything else is a QPM.CLI branch or
      commit'
    default: '^2.0.0'
  package_path:
    required: false
    description: 'Folder containing qpm2.json, relative to the repository root. Can be a subfolder for monorepos'
    default: '.'
  restore:
    required: false
    description: 'Run qpm2 restore'
    default: 'true'
  cache:
    required: false
    description: 'Cache QPM dependencies and the NDK'
    default: 'true'
  resolve_ndk:
    required: false
    description: 'Download the NDK required by qpm2.json. Does nothing if none is set'
    default: 'true'

  # Publishing
  publish:
    required: false
    description:
      'Publish to qpackages.com. "late" publishes at the end of the job, after your build steps, only if the job
      succeeded. "now" publishes in this step. Empty does not publish'
  publish_token:
    required: false
    description: 'qpackages.com token. Required to publish'
  version:
    required: false
    description: 'Version to publish, without "v". Defaults to the git tag (v1.2.3 → 1.2.3), then to qpm2.json'
  tag:
    required: false
    description: 'Github release tag to upload to. Defaults to the git tag, then to the version. Packages may share it'
  upload_release:
    required: false
    description:
      'Upload the qpkg, qmod and binaries to the Github release. When false, they are only built and qpm2 publish is
      skipped, since there is no qpkg url'
    default: 'true'
  upload_qmod:
    required: false
    description:
      'Build and upload the qmod. Empty detects it: only if the package has a mod template (qmod.template or
      mod.template.json)'
    default: ''
  upload_binaries:
    required: false
    description: 'Upload workspace.outBinaries to the Github release'
    default: 'true'

  workflow_token:
    required: false
    description: 'Github token used to download QPM and upload release assets. Needs contents: write to publish'
    default: ${{ github.token }}

outputs:
  qpm_path:
    description: 'Path to the qpm2 executable'
  version:
    description: 'Package version used'
  qpkg_url:
    description: 'Url of the uploaded qpkg. Only set with publish: now'
  qmod_url:
    description: 'Url of the uploaded qmod. Only set with publish: now'

runs:
  using: node24
  main: dist/index.js
  post: 'dist/post/index.js'
  post-if: success()
