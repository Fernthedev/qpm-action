name: 'QPM Action'
description: 'Provides utilities for qpm CI'
author: 'Fernthedev'
inputs:
  package_path:
    required: false
    description: 'Specifies the path to the qpm package'
    default: '.'

  publish:
    required: false
    description:
      'Denotes if this will publish to QPM qpackages.com. Possible values are: "late", "now" or undefined. Late publish
      will only run if action ran with success'

  upload_qmod:
    required: false
    description: 'Denotes if the qmod should be uploaded to the release'
    default: 'true'

  upload_binaries:
    required: false
    description: 'Denotes if the binaries should be uploaded to the release'
    default: 'false'

  qpkg_path:
    required: false
    description: 'Specifies the path to the qpkg file. If not specified, it will be created for publishing'
    default: ''

  # triplet:
  #   required: false
  #   description: 'The triplet to use for restore and build'
  #   default: ''

  qpm_version:
    required: false
    description:
      'The version of QPM to download. Defaults to latest release. Use version@^1.0.0 for release or ref@main for main'

  resolve_ndk:
    required: false
    description: 'Should NDK be downloaded on restore'
    default: 'false'

  version:
    required: false
    description: 'Specifies version to publish. Requires publish'
  tag:
    required: false
    description: 'Specifies tag to use for github release. Defaults to version'

  restore:
    required: false
    description: 'Whether restore should be called. This will use the cache if possible'
    default: 'true'

  cache:
    required: false
    description: 'Specifies if the action should handle caches'
    default: 'true'
  cache_lockfile:
    required: false
    description: 'Specifies if the action should use caches with qpm.shared.json'
    default: 'true'


  workflow_token:
    required: false
    description: 'Specifies the workflow Github Secret Token required for some functionality'
  publish_token:
    required: false
    description: 'The token required for publishing to qpackages.com'

runs:
  using: node20
  main: dist/index.js
  post: 'dist/post/index.js'
  post-if: success()
