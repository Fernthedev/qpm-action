# Unordered list style
MD004:
  style: dash

# Ordered list item prefix
MD029:
  style: ordered

# Spaces after list markers
MD030:
  ul_single: 1
  ol_single: 1
  ul_multi: 1
  ol_multi: 1

# Code block style
MD046:
  style: fenced

# Prettier wraps prose at 120 (.prettierrc.json). Tables and code are not wrapped
MD013:
  line_length: 120
  tables: false
  code_blocks: false
