name: Continuous Integration

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v7 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7 # v7.0.1
        with:
          persist-credentials: false

      # uses the defaults, including the github.token default for workflow_token
      - name: Test Local Action
        id: test-action
        uses: ./

      - name: Check Outputs
        env:
          QPM_PATH: ${{ steps.test-action.outputs.qpm_path }}
          VERSION: ${{ steps.test-action.outputs.version }}
        run: |
          test -n "$QPM_PATH" && test -n "$VERSION"
          "$QPM_PATH" --version
          qpm2 --version
