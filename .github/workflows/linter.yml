name: Lint Codebase

on:
  pull_request:
  push:

permissions:
  contents: read
  packages: read
  statuses: write

jobs:
  lint:
    name: Lint Codebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lint Codebase
        id: super-linter
        uses: super-linter/super-linter/slim@v9 # v9.0.0
        env:
          DEFAULT_BRANCH: main
          FILTER_REGEX_EXCLUDE: (^|/)(dist|coverage)/
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true
          # TypeScript, JavaScript and JSON are linted and formatted by
          # `npm run lint` and `npm run format:check` in ci.yml
          VALIDATE_TYPESCRIPT_ES: false
          VALIDATE_JAVASCRIPT_ES: false
          VALIDATE_JSON: false
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          VALIDATE_JSCPD: false
          VALIDATE_NATURAL_LANGUAGE: false
          VALIDATE_GIT_COMMITLINT: false
